  <script>
    async function loadChartJS() {
      return new Promise((resolve) => {
        if (window.Chart) return resolve(); // already loaded
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
        script.onload = resolve;
        document.head.appendChild(script);
      });
    }
    window.loadChartJS = loadChartJS;
  </script>
  
  <script src="/all.js" type="module"></script>

<body>
  <!-- navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold" onclick="loadPageByPath('/home')">MentalPanda</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="mainNavItems"></ul>
      </div>
    </div>
  </nav>

  <div id="app"></div>

  <style>
    #chatbotToggle {
      transition: .3s;
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 3rem;
      height: 3rem;
      background: #B3E8B0;
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 3rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    #chatbotToggle:hover {
      transition: .3s;
      transform: scale(1.1);
    }

    #chatbotToggle:active {
      transition: .3s;
      transform: scale(1.05);
    }
  
    #chatWindow {
      position: fixed;
      bottom: 5rem;
      right: 5rem;
      width: 300px;
      height: 400px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      display: none; /* hidden by default */
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  
    #chatHeader {
      background: #93d38f;
      color: white;
      padding: 0.5rem;
      text-align: center;
      font-weight: bold;
    }
  
    #chatMessages {
      flex: 1;
      padding: 0.5rem;
      overflow-y: auto;
      font-size: 0.9rem;
    }
  
    #chatInputContainer {
      display: flex;
      border-top: 1px solid #ccc;
    }
  
    #chatInput {
      flex: 1;
      border: none;
      padding: 0.5rem;
      outline: none;
    }
  
    #chatSend {
      padding: 0 1rem;
      background: #B3E8B0;
      color: white;
      border: none;
      cursor: pointer;
    }
  
    .chatMessage {
      margin-bottom: 0.5rem;
    }
  
    .userMessage {
      text-align: right;
      font-weight: bold;
    }
  
    .botMessage {
      text-align: left;
      color: gray;
    }
    /* more styling for chat bot*/
  .typingIndicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    } 

  .typingIndicator span {
    width: 7px;
    height: 7px;
    background: #555;
    border-radius: 50%;
    display: inline-block;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typingIndicator span:nth-child(2) { animation-delay: 0.2s; }
  .typingIndicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
  }
  </style>
  
  <div id="chatbot">
    <img id="chatbotToggle" src="./media/images/pandas/panda-chatting.png"></img>
  
    <div id="chatWindow">
      <div id="chatHeader">ChatBot</div>
      <div id="chatMessages">
        <div class="chatMessage botMessage">Hello! I am your mock chatbot.</div>
      </div>
      <div id="chatInputContainer">
        <input id="chatInput" type="text" placeholder="Type a message..." />
        <button id="chatSend">Send</button>
      </div>
    </div>
  </div>

  <!-- footer -->
  <footer class="py-4 bg-dark text-white">
    <!-- old footer is here
    <div class="container text-center">
        <small>© 2026 MentalPanda. All rights reserved. Want to schedule and appointment? <a href="https://calendly.com/mentalpanda" target="_blank">Book Now</a></small>
      </div> -->
    <div class="container">
      <div class="row g-4">
        <div class="col-md-4">
          <h5>Quick Links</h5>
          <ul class="list-unstyled">
            <li><a href="https://calendly.com/mentalpanda" target="_blank">Book Appointment</a></li>
          </ul>
        </div>

        <div class="col-md-4">
          <h5>Mental Health Reminder</h5>
          <p class="footer-quote">
            “It's okay to not be okay. Asking for help is a sign of strength.”
          </p>
        </div>

        <div class="col-md-4">
          <h5>Crisis Support</h5>
          <p class="text-light">If you or someone you know is in crisis:</p>
          <p class="hotline">
           Call or Text <strong><a href="tel:988" class="crisis-link">988</a></strong><br>
          </p>
        </div>
      </div>
    </div>
  </footer>

  <script src="scripts/ChatBot.js?1" type="module" defer></script>
</body>

</html>
