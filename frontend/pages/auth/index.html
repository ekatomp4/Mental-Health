<section class="hero bg-primary text-white">
    <div class="container text-center py-5">
        <h1 class="display-4 fw-bold">Authentication</h1>
        <p class="lead mt-2">Sign in or create an account to continue.</p>
    </div>
</section>

<div class="container my-5" style="max-width: 480px;">
    <ul class="nav nav-pills nav-fill mb-4 rounded shadow-sm overflow-hidden" id="authTabs">
        <li class="nav-item">
            <button class="nav-link active w-100 rounded-0" id="tab-login" type="button">Login</button>
        </li>
        <li class="nav-item">
            <button class="nav-link w-100 rounded-0" id="tab-register" type="button">Register</button>
        </li>
    </ul>

    <div id="authAlert" class="alert d-none" role="alert"></div>

    <div id="form-login" class="card shadow-sm p-4">
        <h4 class="mb-4 fw-bold text-center">Login</h4>
        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="loginEmail" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required />
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required />
                    <button class="btn btn-outline-secondary toggle-pw" type="button" data-target="loginPassword">👁</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2" id="loginBtn" data-label="Login">Login</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0" style="font-size: 0.9rem;">
            Don't have an account?
            <a href="#" id="switchToRegister">Register here</a>
        </p>
    </div>

    <div id="form-register" class="card shadow-sm p-4 d-none">
        <h4 class="mb-4 fw-bold text-center">Create Account</h4>
        <form id="registerForm" novalidate>
            <div class="mb-3">
                <label for="regUsername" class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control" id="regUsername" placeholder="PandaFan123" required />
            </div>
            <div class="mb-3">
                <label for="regEmail" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" required />
            </div>
            <div class="mb-3">
                <label for="regPassword" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required />
                    <button class="btn btn-outline-secondary toggle-pw" type="button" data-target="regPassword">👁</button>
                </div>
            </div>
            <div class="mb-3">
                <label for="regConfirm" class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="regConfirm" placeholder="••••••••" required />
                    <button class="btn btn-outline-secondary toggle-pw" type="button" data-target="regConfirm">👁</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2" id="registerBtn" data-label="Create Account">Create Account</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0" style="font-size: 0.9rem;">
            Already have an account?
            <a href="#" id="switchToLogin">Login here</a>
        </p>
    </div>
</div>
