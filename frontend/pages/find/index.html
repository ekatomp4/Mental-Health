
<!--Tetsing html - mack -->
<!-- 988 Crisis Banner -->
 <link rel="stylesheet" href="styles.css" />
<div class="alert alert-danger text-center mb-0 py-2" role="alert" style="border-radius:0;">
  <i class="bi bi-heart-pulse-fill me-2"></i>
  <strong>In crisis?</strong> Call or text
  <a href="tel:988" class="alert-link fw-bold">988</a>
  for the Suicide &amp; Crisis Lifeline — free, confidential, 24/7.
</div>

<!-- Hero -->
<section class="hero bg-success text-white">
  <div class="container text-center py-5">
    <h1 class="display-4 fw-bold">Find a Therapist</h1>
    <p class="lead mt-2">Enter your location below to find mental health providers near you.</p>
  </div>
</section>

<!-- Panda -->
<div class="pandaCare my-4">
  <div alt="person hugging panda"></div>
</div>

<!-- Search Form -->
<div class="container my-4">
  <h2 class="text-center mb-4">Search by Location</h2>

  <form id="provider-search-form" class="mx-auto" style="max-width:640px;">
    <div class="row g-3">

      <!-- Zip Code -->
      <div class="col-sm-4">
        <label for="search-zip" class="form-label fw-semibold">Zip Code</label>
        <input
          type="text"
          id="search-zip"
          class="form-control"
          placeholder="e.g. 44141"
          maxlength="10"
        />
      </div>

      <!-- City -->
      <div class="col-sm-4">
        <label for="search-city" class="form-label fw-semibold">City</label>
        <input
          type="text"
          id="search-city"
          class="form-control"
          placeholder="e.g. Cleveland"
        />
      </div>

      <!-- State -->
      <div class="col-sm-4">
        <label for="search-state" class="form-label fw-semibold">State</label>
        <select id="search-state" class="form-select">
          <option value="">Select State</option>
          <option value="AL">Alabama</option>
          <option value="AK">Alaska</option>
          <option value="AZ">Arizona</option>
          <option value="AR">Arkansas</option>
          <option value="CA">California</option>
          <option value="CO">Colorado</option>
          <option value="CT">Connecticut</option>
          <option value="DE">Delaware</option>
          <option value="FL">Florida</option>
          <option value="GA">Georgia</option>
          <option value="HI">Hawaii</option>
          <option value="ID">Idaho</option>
          <option value="IL">Illinois</option>
          <option value="IN">Indiana</option>
          <option value="IA">Iowa</option>
          <option value="KS">Kansas</option>
          <option value="KY">Kentucky</option>
          <option value="LA">Louisiana</option>
          <option value="ME">Maine</option>
          <option value="MD">Maryland</option>
          <option value="MA">Massachusetts</option>
          <option value="MI">Michigan</option>
          <option value="MN">Minnesota</option>
          <option value="MS">Mississippi</option>
          <option value="MO">Missouri</option>
          <option value="MT">Montana</option>
          <option value="NE">Nebraska</option>
          <option value="NV">Nevada</option>
          <option value="NH">New Hampshire</option>
          <option value="NJ">New Jersey</option>
          <option value="NM">New Mexico</option>
          <option value="NY">New York</option>
          <option value="NC">North Carolina</option>
          <option value="ND">North Dakota</option>
          <option value="OH">Ohio</option>
          <option value="OK">Oklahoma</option>
          <option value="OR">Oregon</option>
          <option value="PA">Pennsylvania</option>
          <option value="RI">Rhode Island</option>
          <option value="SC">South Carolina</option>
          <option value="SD">South Dakota</option>
          <option value="TN">Tennessee</option>
          <option value="TX">Texas</option>
          <option value="UT">Utah</option>
          <option value="VT">Vermont</option>
          <option value="VA">Virginia</option>
          <option value="WA">Washington</option>
          <option value="WV">West Virginia</option>
          <option value="WI">Wisconsin</option>
          <option value="WY">Wyoming</option>
        </select>
      </div>

      <!-- Care Type -->
      <div class="col-12">
        <label for="search-care-type" class="form-label fw-semibold">Type of Help</label>
        <select id="search-care-type" class="form-select">
          <option value="any">Any Provider</option>
          <option value="therapist">Therapist / Psychologist</option>
          <option value="clinic">Clinic</option>
          <option value="mental_health">Mental Health Center</option>
        </select>
      </div>

      <!-- Submit -->
      <div class="col-12 text-center">
        <button type="submit" class="btn btn-primary px-5 py-2 fw-semibold">
          <i class="bi bi-search me-2"></i>Find Help Near Me
        </button>
      </div>

    </div>
  </form>

  <!-- Status & Spinner -->
  <p id="search-status" class="text-center mt-3"></p>
  <div class="spinner-wrapper" id="spinner">
    <div class="spinner-border" style="color:#198754;" role="status">
      <span class="visually-hidden">Searching…</span>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="row mt-4"></div>

</div>
