<style>
    .chat-page {
        height: calc(100vh - 140px);
        min-height: 420px;
        padding: 1rem;
    }

    .chat-panel {
        height: 100%;
        border-radius: 16px;
        overflow: hidden;
    }

    #chatMessages {
        overflow-y: auto;
        overflow-x: hidden;
    }

    @media (max-width: 768px) {
        .chat-page {
            height: calc(100vh - 120px);
            padding: 0.5rem;
        }
    }
</style>

<div class="container-fluid chat-page">
    <div class="row h-100 g-0">
        <main class="col-12 h-100">
            <div class="card chat-panel shadow-sm d-flex flex-column h-100">
                <div class="card-header fw-semibold">Global Chat</div>

                <div class="card-body flex-grow-1" id="chatMessages"></div>

                <div class="card-footer">
                    <div class="d-flex gap-2">
                        <input id="chatInput" type="text" class="form-control" placeholder="Type a message" />
                        <button id="chatSend" class="btn btn-primary" type="button">
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
